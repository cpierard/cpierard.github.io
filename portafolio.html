<style>
.pf { --rule: rgba(128, 128, 128, .35); max-width: 900px; margin: 0 auto; }
.pf-filter { display: flex; flex-wrap: wrap; gap: 0 1.5rem; margin: 0 0 2.5rem; border-bottom: 1px solid var(--rule); }
.pf-filter button { font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: .5rem 0; cursor: pointer; opacity: .6; transition: opacity .15s, border-color .15s; }
.pf-filter button:hover { opacity: 1; }
.pf-filter button[aria-pressed="true"] { opacity: 1; border-bottom-color: currentColor; }
.pf-sec { padding: 0 0 2.5rem; }
.pf-sec + .pf-sec { border-top: 1px solid var(--rule); padding-top: 2.5rem; }
.pf-head { padding-bottom: .75rem; }
.pf-head h2 { margin: 0; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.01em; }
.pf-rows { list-style: none; margin: 0; padding: 0; }
.pf-row { display: grid; grid-template-columns: 160px 1fr; gap: 0 1.25rem; padding: .9rem 0; }
.pf-fig img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 3px; }
.pf-title { font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
.pf a.pf-title { text-decoration: none; }
.pf a.pf-title:hover, .pf a.pf-title:focus-visible { text-decoration: underline; }
.pf-wip { font-size: .8rem; margin-left: .6rem; padding: .1rem .5rem; border: 1px dashed currentColor; border-radius: 999px; opacity: .7; white-space: nowrap; }
.pf-desc { margin: .35rem 0 0; opacity: .85; }
.pf-tags { margin: .5rem 0 0; font-size: .85rem; letter-spacing: .02em; opacity: .65; }
@media (max-width: 640px) {
  .pf-row { grid-template-columns: 1fr; }
  .pf-fig:empty { display: none; }
  .pf-fig { margin-bottom: .75rem; }
  .pf-head h2 { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) { .pf-filter button { transition: none; } }
</style>

<div class="pf">
<div id="pf-filter" class="pf-filter" role="group" aria-label="Filter by skill"></div>
<div id="pf-list"></div>
<noscript>
<ul>

<li><a href="{{ '/projects/convection/' | relative_url }}">Two-dimensional simulation of convection in a stratified fluid</a></li>
</ul>
</noscript>
</div>

<script>
(function () {
  /* EDIT HERE. Each skill is a section with a label and its projects.
     Project fields: title, url (or null), desc, img (optional thumbnail), wip (true shows "In progress"),
     tags (optional extra labels). A project listed under two skills is shown in full under the first and as
     a short cross-reference (with its image) in the "All" view; the other skills are added to its tags automatically. */
  var DATA = [
    { label: "Oceanography",
      items: [
        { title: "Abyssal turbulence in the vicinity of Lucky Strike hydrothemal vents", url: "{{ '/projects/luckystrike/' | relative_url }}", desc: "Spectral analysis of 10-year seafloor measurements in ocean hydrothermal vents.", img: "{{ '/assets/projects/vents/PSD_2017_slopes.png' | relative_url }}", tags: ["Python", "Signal Processing", "Time Series Analysis", "Ocean Physics"]},
        { title: "Backtracking nanoplastics sampled in the abyssal South Atlantic", url: "{{ '/projects/backtrack-nps/' | relative_url }}", desc: "Lagrangian backtracking of nanoplastics found in the deep South Atlantic.", img: "{{ '/assets/projects/backtrack/icon.jpeg' | relative_url }}", tags:["Bayesian Inference", "Python", "Parcels"] },
        { title: "Coastal ocean modelling with CROCO", url: null, wip: true, desc: "Personal compilation of CROCO simulations.", tags: ["CROCO 🐊", "Python"], img: null }
      ] },
    { label: "Computational fluid dynamics",
      items: [
        { title: "LES simulation of a buoyant plume", url: "{{ '/projects/plume/' | relative_url }}", desc: "Idealized 3D plume from an ocean hydrothermal vent.", img: "{{ '/assets/projects/plume/steady_snapshot.png' | relative_url }}", tags: ["Python", "Computational Fluid Dynamics"]},
        { title: "Two-dimensional simulation of convection in a stratified fluid", url: "{{ '/projects/convection/' | relative_url }}", desc: "2D idealized simulation of atmospheric thermal inversion.", img: "{{ '/assets/projects/convection/ugm_28_NN.png' | relative_url }}", tags: ["Python", "Computational Fluid Dynamics", "Atmospheric Physics"] }
      ] },
    { label: "Numerical modeling and deep learning",
      items: [
        { title: "Moguls of chaos - Part 1", url: "{{ '/projects/moguls-of-chaos/' | relative_url }}", desc: "Ski inspired toy model that is chaotic. Computing the strange attractors and bifurcation diagram.", img: "{{ '/assets/projects/moguls_of_chaos/Ski_school_on_moguls_Edelweiss_slope_Les_Arcs.jpg' | relative_url }}", tags:["Julia", "Python", "Dynamical Systems"]},
        { title: "Moguls of chaos with deep learning - Part 2", url: null, wip: true, desc: "PyTorch through a neural network project.", img: null, tags:["Pytorch", "Deep Learning", "Dynamical Systems"] }
      ] },
    { label: "Statistics and inference",
      items: [
        { title: "Bayesian inference of river plastics in the South Atlantic", url: "{{ '/projects/bayesian-plastic/' | relative_url }}", desc: "Attributing floating plastic to river sources.", img: "{{ '/assets/projects/bayesian/posterior_contour_Cape-Town.png' | relative_url }}", tags:["Bayesian Inference", "Python", "Parcels"] },
        { title: "Information theory for ensemble particle simulations", url: null, wip: true, desc: "Based on Pierard 2025. Comparing Lagrangian ensemble simulations with entropy and KL divergence.", img: null, tags:["Information Theory", "Python", "Parcels"]}
      ] }
  ];

  var root = document.getElementById("pf-list"), bar = document.getElementById("pf-filter");
  var current = "all", buttons = [];

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  var where = {};
  DATA.forEach(function (s) {
    s.items.forEach(function (it) { (where[it.title] = where[it.title] || []).push(s.label); });
  });

  function titleNode(it) {
    if (it.url) { var a = h("a", "pf-title", it.title); a.href = it.url; return a; }
    return h("span", "pf-title", it.title);
  }

  function row(it, s, dupeOf) {
    var li = h("li", "pf-row" + (dupeOf ? " pf-dupe" : ""));
    var fig = h("div", "pf-fig");
    if (it.img) {
      var im = h("img"); im.src = it.img; im.alt = ""; im.loading = "lazy";
      if (it.url) { var l = h("a"); l.href = it.url; l.tabIndex = -1; l.setAttribute("aria-hidden", "true"); l.appendChild(im); fig.appendChild(l); }
      else fig.appendChild(im);
    }
    li.appendChild(fig);
    var body = h("div", "pf-body");
    var t = h("div"); t.appendChild(titleNode(it));
    if (it.wip) t.appendChild(h("span", "pf-wip", "In progress"));
    body.appendChild(t);
    if (dupeOf) {
      body.appendChild(h("p", "pf-tags", "Also listed under " + dupeOf));
    } else {
      if (it.desc) body.appendChild(h("p", "pf-desc", it.desc));
      var tags = (it.tags || []).concat(where[it.title].filter(function (l) { return l !== s.label; }));
      if (tags.length) body.appendChild(h("p", "pf-tags", tags.join(", ")));
    }
    li.appendChild(body);
    return li;
  }

  function render() {
    root.textContent = "";
    var seen = {};
    DATA.forEach(function (s) {
      if (current !== "all" && current !== slug(s.label)) return;
      var sec = h("section", "pf-sec");
      var head = h("div", "pf-head"); head.appendChild(h("h2", "", s.label)); sec.appendChild(head);
      var ul = h("ul", "pf-rows");
      s.items.forEach(function (it) {
        var dupeOf = current === "all" ? seen[it.title] : null;
        if (!seen[it.title]) seen[it.title] = s.label;
        ul.appendChild(row(it, s, dupeOf));
      });
      sec.appendChild(ul); root.appendChild(sec);
    });
  }

  function choose(key) {
    current = key;
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.key === key ? "true" : "false"); });
    render();
    if (history.replaceState) history.replaceState(null, "", key === "all" ? location.pathname : "#" + key);
  }

  [{ label: "All", key: "all" }].concat(DATA.map(function (s) { return { label: s.label, key: slug(s.label) }; })).forEach(function (o) {
    var b = h("button", "", o.label); b.type = "button"; b.dataset.key = o.key;
    b.addEventListener("click", function () { choose(o.key); });
    bar.appendChild(b); buttons.push(b);
  });

  var start = location.hash.replace("#", "");
  var valid = DATA.some(function (s) { return slug(s.label) === start; });
  choose(valid ? start : "all");
})();
</script>
